[project]
name = "godaikin-local"
version = "0.3.0"
description = "Cloud-free Home Assistant integration for GO DAIKIN air conditioners"
requires-python = ">=3.13"

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component",
  "pytest-cov",
  "mypy",
  "homeassistant-stubs",
  "ruff",
]

[tool.ruff]
target-version = "py313"
line-length = 110
src = ["custom_components/godaikin_local", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PL", "N", "C4", "T20"]
ignore = [
  "PLR2004", # magic values are protocol constants, documented inline
  "PLR0913", # HA entity constructors take several args
  "T201",    # print() is fine in tools/
  "RUF012",  # HA uses mutable class attributes by convention
]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["PLR0912", "PLR0915", "C901"]
"tests/*" = ["PLR0915", "PLR0917", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.godaikin_local"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider --cov=custom_components/godaikin_local --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
omit = ["custom_components/godaikin_local/cloud.py"]  # covered by tests through mocks; HTTP path needs the vendor API
branch = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["custom_components/godaikin_local"]

[[tool.mypy.overrides]]
module = ["cryptography.*", "voluptuous.*", "aiohttp.*"]
ignore_missing_imports = true
