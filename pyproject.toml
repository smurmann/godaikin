[project]
name = "godaikin-local"
version = "0.2.0"
description = "Cloud-free Home Assistant integration for GO DAIKIN air conditioners"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 110
src = ["custom_components/godaikin_local", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PL", "N", "C4", "T20"]
ignore = [
  "PLR2004", # magic values are protocol constants, documented inline
  "PLR0913", # HA entity constructors take several args
  "T201",    # print() is fine in tools/
  "RUF012",  # HA uses mutable class attributes by convention
]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["PLR0912", "PLR0915", "C901"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.godaikin_local"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tools"]
python_files = ["test_*.py"]
